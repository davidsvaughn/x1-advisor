# Entity-slot fixture registry (GOLDEN-V2-DESIGN §7.1; compiled by
# experiments/cases.py).
#
# A case declares the PROPERTY it needs (`bindings: {startup: evaluated_startup}`)
# and a seeded resolver picks the concrete entity per run. The author therefore
# never names the company a case will run against, which is David's P4 §9 rule
# ("avoid overusing a single company name") made mechanical, and the reason
# paraphrase/entity rotation in the extended tier falls out for free.
#
# Pool entries:
#   name       required — the entity name as it appears in the corpus
#   entity_type optional — company | person | investor | organization
#   entity_id  optional — platform id where one exists
#   note       optional — why this entity is in the pool
#
# Two kinds of pool, and the distinction matters:
#   * hand-listed  — membership is a plain fact of the corpus that no answer
#                    depends on (e.g. "startups that have an evaluation").
#   * corpus-derived — membership IS the answer to some case's question
#                    (e.g. `has_regulatory_mention`). Those are GENERATED by the
#                    truth-set builder (§5.1, build step 2) and must never be
#                    hand-listed here: an author-written membership list is the
#                    friendly answer key §7.3 exists to prevent.
#
# Populated in build steps 2–3; a case binding to a missing pool fails the
# compile, and an empty pool fails loudly at resolve time rather than silently
# skipping the case.

pools: {}
