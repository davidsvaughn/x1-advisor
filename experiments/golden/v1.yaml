# Golden set v1 (PLAN Phase 2) — 45 questions grounded in the test corpus
# (2026-07-08: 50 test startups + 24 prod fixture bundles + 75 CVs + investors/orgs).
#
# Grading contract (experiments/run.py):
#   expected: list of matchers. A hit matches a matcher when ALL its fields hold:
#     source_type       — equality on documents.source_type
#     title_contains    — case-insensitive substring on document title
#     company_name      — equality on chunk metadata company_name
#     section_key       — equality on chunk metadata section_key
#     entity_type       — equality on chunk metadata entity_type
#   recall@k  = matched expected / total expected (within top-k)
#   MRR       = 1 / rank of first matching hit
#   web_required: true → skipped by the retrieval harness (E3 grades these later).
#
# Hard negatives built in: "Accelium Partners AG" (test startup) vs
# "AcceliumPartnersAG"/"Accelium Partners GmbH" (prod fixtures); two Matt Young CVs;
# similar sports startups (Athlete's Edge fixture vs ATHLETE DEVELOPMENT GROUP fixture).

version: v1
questions:
  # ---- entity lookup ------------------------------------------------------
  - id: g001
    category: entity_lookup
    question: What does X1 Pipeline do and what is its business model?
    expected:
      - {source_type: profile, title_contains: "X1 Pipeline"}
  - id: g002
    category: entity_lookup
    question: What problem is 2ndCourt.com solving?
    expected:
      - {company_name: "2ndCourt.com", section_key: problem}
  - id: g003
    category: entity_lookup
    question: Tell me about Orphagen Pharmaceuticals.
    expected:
