# ======================================================================
# SCRIPTS (§8) — graded as sequences. A script passes only as a whole; the
# per-turn results still feed the funnel. Coreference, working-set carryover
# and evidence fidelity are only testable here.
# ======================================================================

scripts:

  - id: v2s001
    class: evidence_fidelity
    tier: core
    provenance: "SCR Script A — David's canonical loop, verbatim"
    bindings: {}
    readiness: {source_available: true, tool_ready: false, scope: corpus,
                operation: exact_scan, context_required: prior_answer,
                golden_priority: p0}
    blocked_on: scan_text
    fallback_contract: coverage_disclosure
    turns:
      - question: "show all the startups in the database"
        grade:
          deterministic: {must_cite: true}
      - question: "just show the ones with score over 77"
        grade:
          deterministic: {must_cite: true}
      - question: "which of these startups mention regulatory risk in their evaluation?"
        grade:
          deterministic: {must_disclose_coverage: true,
                          must_not_claim_exhaustive: true, must_cite: true}
          judged: [faithfulness]
      - question: "pull the exact quotes for each startup"
        grade:
          deterministic: {must_quote_verbatim: true, must_cite: true}
          judged: [faithfulness]
      - question: "show me the best evidence (best quotes) for each startup"
        grade:
          deterministic: {must_quote_verbatim: true, must_cite: true}
          judged: [faithfulness]
    cross_turn:
      - {type: set_carryover, from_turn: 1, to_turn: 2}
      - {type: set_carryover, from_turn: 2, to_turn: 3}
      - {type: quotes_from_turn, from_turn: 3, to_turn: 4}
      - {type: quotes_from_turn, from_turn: 3, to_turn: 5}

  - id: v2s002
    class: enumeration_text
    tier: core
    provenance: "SCR Script B — 3-question variant"
    bindings: {}
    readiness: {source_available: true, tool_ready: false, scope: corpus,
                operation: exact_scan, context_required: prior_answer,
                golden_priority: p0}
    blocked_on: scan_text
    fallback_contract: coverage_disclosure
    turns:
      - question: "show me the startups with a score over 77"
        grade:
          deterministic: {must_cite: true}
      - question: "which of these mention regulatory risk in their evaluation?"
        grade:
          deterministic: {must_disclose_coverage: true,
                          must_not_claim_exhaustive: true, must_cite: true}
          judged: [faithfulness]
      - question: "show me the best quotes for each"
        grade:
          deterministic: {must_quote_verbatim: true, must_cite: true}
          judged: [faithfulness]
    cross_turn:
      - {type: set_carryover, from_turn: 1, to_turn: 2}
      - {type: quotes_from_turn, from_turn: 2, to_turn: 3}
      - {type: no_new_entities, from_turn: 1, to_turn: 3}

  - id: v2s003
    class: coverage_challenge
    tier: core
    provenance: "LFT — real captured turns (bank#118, bank#119)"
    bindings: {}
    readiness: {source_available: true, tool_ready: false, scope: corpus,
                operation: exact_scan, context_required: prior_answer,
                golden_priority: p0}
    blocked_on: scan_text
    fallback_contract: coverage_disclosure
    notes: >
      The gold of the QA loop: real users asked both of these immediately. The
      challenge turns are graded against what the PRIOR turn's bundle actually
      searched, never against what the answer claims it searched.
    turns:
      - question: "which startups mention regulatory risk in their evaluations?"
        grade:
          deterministic: {must_disclose_coverage: true,
                          must_not_claim_exhaustive: true, must_cite: true}
          judged: [faithfulness]
      - question: "Did you search all 20 startups?"
        grade:
          deterministic: {must_disclose_coverage: true}
          behavior: [state_absence]
          judged: [faithfulness]
      - question: "Why did you only search their summaries?"
        grade:
          deterministic: {must_disclose_coverage: true}
          judged: [faithfulness]
    cross_turn:
      - {type: coverage_claim_grounded, turn: 2}
      - {type: coverage_claim_grounded, turn: 3}

  - id: v2s004
    class: inventory_coverage
    tier: core
    provenance: "bank#68 + bank#13 — inventory then evidence, compound"
    bindings: {}
    readiness: {source_available: true, tool_ready: false, scope: corpus,
                operation: inventory, context_required: prior_answer,
                golden_priority: p1}
    blocked_on: coverage_query
    fallback_contract: honest_absence
    notes: >
      Tests the confusion P4 §8 asks to record: an evidence question falling
      back to raw document inventory, or an inventory question answered with
      evidence. Turn 2 must operate on the set turn 1 established.
    turns:
      - question: "Which startups have pitch decks?"
        grade:
          deterministic: {must_disclose_coverage: true, must_cite: true}
          behavior: [state_absence]
      - question: "What do those decks say about traction?"
        grade:
          deterministic: {must_cite: true}
          judged: [faithfulness, citation_coverage]
    cross_turn:
      - {type: set_carryover, from_turn: 1, to_turn: 2}
      - {type: no_new_entities, from_turn: 1, to_turn: 2}
