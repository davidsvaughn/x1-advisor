# Golden set v2.0 — the agent/answer-quality suite (Gate 4).
# Specification: docs/GOLDEN-V2-DESIGN-2026-07-31.md. Compiler + full field
# vocabulary: experiments/cases.py (`uv run python -m experiments.cases`).
#
# This is NOT v1 with more questions. v1 (experiments/golden/v1.yaml) is frozen
# as the retrieval-regression suite and keeps its `questions:` + `expected:`
# matcher shape; v2 uses `cases:` + `scripts:` and grades answers, not hits.
# The two are different scoring contracts and are never averaged (§10).
#
# Provenance is mandatory: `bank#N` is a row of docs/QUESTION-BANK.md, `P4
# compact #N` is the Phase-4 compact smoke set (bank Script C), `§6` is a
# truth-robustness case defined by the design itself. Wording is verbatim
# wherever the source is a real user turn or a real test list — the phrasing is
# the test. Where a case parameterizes an entity slot (§7.1) the `notes:` field
# says so.
#
# Curation, not copying (bank §0): a question repeated across historical
# sources counts once, and the compiler rejects duplicate question text.
#
# Corpus reality this suite is authored against (measured 2026-07-31):
#   * 25 of 64 company names have evaluation documents; 39 test startups have
#     none, so a corpus-wide enumeration's honest denominator is 25, not 50.
#   * 9 company names exist as BOTH a prod fixture bundle and a test entity,
#     which is why every truth set records two denominators (entity_key).
#   * the investor/organization profiles are nearly empty of thematic language
#     (biotech/medtech/climate ≈ 0 hits), so those enumeration cases are
#     honesty tests with verified-empty oracles, not recall tests.
#   * `PhD` has zero hits in the CVs while `Ph.D` has three — v2c040 exists
#     because reporting "no founders have PhDs" from a lexical no-match is
#     precisely the honesty failure bank §3.2 forbids.

