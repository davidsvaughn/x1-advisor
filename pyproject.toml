[project]
name = "x1-advisor"
version = "0.1.0"
description = "X1 Advisor — interactive research agent over the X1 CRM, document store, and web"
requires-python = ">=3.12,<3.14"
dependencies = [
    "haystack-ai>=2.30,<3",
    "anthropic-haystack>=5.12",
    "pgvector-haystack>=6.3",
    "anthropic>=0.116",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "google-cloud-storage>=3.12.0",
    "markdownify>=1.2.3",
    "pyyaml>=6.0.3",
    "langfuse>=4.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["x1_advisor"]
